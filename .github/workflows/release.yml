# Releases the editor — started by hand, never by a push.
#
# Pre-1.0 and deliberate: bump `version` in projects/angular-email-editor/
# package.json in a commit, merge it to main, then run this (Actions → Release →
# Run workflow, on main). It stages that version on npm through Trusted
# Publishing (this file's name is what npm trusts — no token in the repo);
# a staged version is not installable until a maintainer approves it with 2FA,
# on npmjs.com or with `npm stage approve`. Then the commit is tagged v<version>.
#
# Dawn (@h-k-dev/dawn), which the editor depends on, releases itself from
# main (ci.yml, release-dawn) and is never released here: the editor only
# checks that the Dawn it asks for is on npm.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write # the v<version> tag
  id-token: write # npm Trusted Publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # No `registry-url` here: with one, setup-node writes an .npmrc whose
      # token comes from NODE_AUTH_TOKEN — a dummy placeholder when no secret
      # is given — and npm sends that (E401) instead of using Trusted
      # Publishing's OIDC exchange.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Staged publishing and OIDC need a recent npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Read the version
        id: version
        run: echo "value=$(node -p "require('./projects/angular-email-editor/package.json').version")" >> "$GITHUB_OUTPUT"

      # A version is released once: not tagged yet, not on npm yet.
      - name: Check the version is new
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION is already tagged — bump the version first."; exit 1
          fi
          if npm view "@h-k-dev/angular-email-editor@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$VERSION is already on npm — bump the version first."; exit 1
          fi

      # The editor's Dawn must be installable: released (ci.yml) before the
      # editor that asks for it.
      - name: Check the editor's Dawn is on npm
        run: |
          WANTS=$(node -p "require('./projects/angular-email-editor/package.json').dependencies['@h-k-dev/dawn']")
          if [[ -z "$(npm view "@h-k-dev/dawn@$WANTS" version 2>/dev/null)" ]]; then
            echo "::error::No @h-k-dev/dawn on npm matches $WANTS — release Dawn first."; exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test Dawn
        run: npx ng test dawn --watch=false

      - name: Test library
        run: npx ng test angular-email-editor --watch=false

      # Dawn first: the editor builds against it.
      - name: Build packages
        run: npm run build:lib

      - name: Load built entries
        run: node scripts/load-entries.mjs

      # A pre-release (0.1.0-beta.1) goes out under `next`, never as `latest`.
      # Verbose: npm says why a Trusted Publishing exchange failed only at
      # that level — otherwise all that shows is ENEEDAUTH.
      - name: Stage on npm
        working-directory: dist/angular-email-editor
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm stage publish --tag next --loglevel verbose
          else
            npm stage publish --loglevel verbose
          fi

      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
