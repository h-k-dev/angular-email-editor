# Checks every change, and deploys the demo from main.
#
# Two packages, two ways out:
# - @h-k-dev/dawn, the render engine, releases itself from main
#   (release-dawn below: semantic-release, the version read off the
#   conventional commits that touch projects/dawn — none, no release). npm's
#   Trusted Publishing names this file for Dawn.
# - @h-k-dev/angular-email-editor is pre-v1 and released slowly, by hand — a
#   separate, manually started workflow (release.yml, the one npm's Trusted
#   Publishing names for the editor). A merge to main does not release it.
name: CI

on:
  pull_request:
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The inbox's listing is read out of the example files: stale is wrong.
      - name: Inbox listing
        run: node scripts/inbox-listing.mjs --check

      # jsdom, against the packages' sources.
      - name: Test Dawn
        run: npx ng test dawn --watch=false

      - name: Test library
        run: npx ng test angular-email-editor --watch=false

      # The demo reads both packages from dist/, so they are built before the
      # app — Dawn first, the editor builds against it.
      - name: Build packages
        run: npm run build:lib

      # Native ESM, which throws on a load-time read of a later `const` that
      # the esbuild-bundled specs above turn into a silent `undefined` — and
      # Dawn's bundle, which may import nothing at all.
      - name: Load built entries
        run: node scripts/load-entries.mjs

      - name: Test demo
        run: npx ng test app --watch=false

      # Real Chromium: layout, fonts, the canvas text metrics measure with.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test in Chromium
        run: npm run test:render

      # The demo as GitHub Pages serves it: under /angular-email-editor/, and
      # 404.html is the app too, so a deep link (/angular-email-editor/api)
      # reloads into the app instead of Pages' own 404.
      - name: Build demo
        run: |
          npx ng build app --base-href /angular-email-editor/
          cp dist/app/browser/index.html dist/app/browser/404.html

      - name: Upload demo for Pages
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/app/browser

  deploy-pages:
    needs: verify
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and never cancel one half-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Dawn, when commits under projects/dawn call for it: a `fix` a patch, a
  # `feat` a minor, a breaking change a major; anything else — or nothing of
  # Dawn's — no release. Published through Trusted Publishing (OIDC), tagged
  # dawn-v<version>, with a GitHub release of its notes.
  release-dawn:
    needs: verify
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the dawn-v<version> tag and release
      issues: write # semantic-release's comments on what it released
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC)
    concurrency:
      group: release-dawn
      cancel-in-progress: false
    steps:
      # The whole history: the version is read off the commits since the
      # last dawn-v tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No `registry-url`: setup-node's .npmrc would send a placeholder token
      # instead of Trusted Publishing's OIDC exchange (see release.yml).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # OIDC Trusted Publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build Dawn
        run: npx ng build dawn

      - name: Release Dawn
        working-directory: projects/dawn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -p semantic-release@25 -p semantic-release-monorepo@8 semantic-release
