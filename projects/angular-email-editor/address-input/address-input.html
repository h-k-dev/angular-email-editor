<!-- No label here: the row around this control names it, through
     aria-labelledby or aria-label, both passed down to the text input. -->
<!-- Focusable by script and by a press only (tabindex -1, while chips can
     be dragged): a press on a draggable chip must keep its default for the
     drag to start, and its focus lands here — inside the control. -->
<ul #chipList data-slot="chips" role="list" [attr.tabindex]="canDrag() ? -1 : null">
  <!-- The opt-in label (emailAddressLabel): first in the row, so the chips
       wrap under it. Hidden from assistive tech as text — it names the
       text input instead, through aria-labelledby. -->
  @if (labelSlot(); as slot) {
    <li data-slot="label" aria-hidden="true" [id]="labelId">
      <ng-container [ngTemplateOutlet]="slot.template" />
    </li>
  }
  @for (address of value(); track address) {
    <li
      email-address-chip
      [id]="chipId($index)"
      [address]="address"
      [removable]="!locked()"
      [inline]="!focused()"
      [draggable]="canDrag()"
      [aria-current]="active() === $index"
      [removeTabbable]="closed()"
      [removeLabel]="removeLabel()"
      [removeTemplate]="removeSlot()?.template ?? null"
      [invalidLabel]="invalidLabel()"
      [pendingLabel]="pendingLabel()"
      [aria-disabled]="disabled()"
      (removed)="removeChip(address)"
      (copied)="onChipCopied($event)"
      (click)="onChipClick($event, $index, field)"
      (dblclick)="onChipDblclick($event, address, field)"
      (dragstart)="onChipDragstart(address)"
      (dragend)="onChipDragend()"
    ></li>
  }
  <!-- Where a drag over the control would land: a line between entries,
     drawn on top and out of the flow — nothing moves under the pointer. -->
  @if (dropMarker(); as marker) {
    <li
      data-slot="drop-marker"
      aria-hidden="true"
      [style.left.px]="marker.x"
      [style.top.px]="marker.y"
      [style.height.px]="marker.height"
    ></li>
  }
  <!-- The entry is a list item too, so the chips and the typing sit in one
       wrapping row — always after the last chip. Hidden once the field is full (From takes one address)
       with nothing to fix: the chips say everything, and a second address
       would only be refused. -->
  <li data-slot="entry" [hidden]="closed()">
    <input
      #field
      data-slot="input"
      type="text"
      inputmode="email"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      [id]="id"
      [attr.name]="name() || null"
      [disabled]="disabled()"
      [readOnly]="readonly()"
      [placeholder]="value().length ? '' : placeholder()"
      [attr.aria-labelledby]="labelledBy()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="flagged() || refused() || null"
      [attr.aria-activedescendant]="activeId()"
      [attr.data-refused]="refused() || null"
      (keydown)="onKeydown($event, field)"
      (paste)="onPaste($event, field)"
      (copy)="onClipboard($event, field, false)"
      (cut)="onClipboard($event, field, true)"
      (input)="onInput(field)"
      (mousedown)="active.set(null)"
      (focus)="onFocus(field)"
      (blur)="onBlur($event, field)"
    />
  </li>
</ul>
