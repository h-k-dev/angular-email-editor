<!-- Every part carries data-slot: that is its styling hook, and for icon and
     progress also its projection selector — project an element with the same
     data-slot into the chip to replace the default. -->
<ng-content select="[data-slot=icon]">
  <svg data-slot="icon" viewBox="0 0 16 16" aria-hidden="true">
    <path [attr.d]="icon()" />
  </svg>
</ng-content>

<span data-slot="label">
  <!-- title, not a tooltip component: the name is truncated in CSS, and the
       native title is what recovers the whole of it. -->
  <span data-slot="name" [title]="attachment().name">{{ attachment().name }}</span>
  @if (size()) {
    <span data-slot="size">{{ size() }}</span>
  }
</span>

<ng-content select="[data-slot=progress]">
  @if (mode(); as m) {
    <!-- A simulated run is announced as busy, never with a number: the
         fake is for the eye, not for assistive tech. -->
    <svg
      data-slot="progress"
      [attr.data-mode]="m"
      viewBox="0 0 20 20"
      role="progressbar"
      [attr.aria-label]="progressLabel() + ' ' + attachment().name"
      [attr.aria-valuenow]="m === 'determinate' ? percent() : null"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <circle data-slot="progress-track" cx="10" cy="10" r="7.5" />
      <circle
        data-slot="progress-indicator"
        cx="10"
        cy="10"
        r="7.5"
        pathLength="100"
        [style.stroke-dashoffset]="m === 'determinate' ? 100 - percent() : null"
        [style.animation-duration.ms]="m === 'simulated' ? duration() : null"
      />
    </svg>
  }
</ng-content>

@if (removable()) {
  <button
    type="button"
    data-slot="remove"
    [disabled]="ariaDisabled()"
    [attr.aria-label]="removeLabel() + ' ' + attachment().name"
    (click)="removed.emit()"
  >
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4.5 4.5l7 7 M11.5 4.5l-7 7" />
    </svg>
  </button>
}
