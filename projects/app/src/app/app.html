<mat-toolbar class="app-toolbar">
  <nav class="app-nav" aria-label="Pages">
    @for (page of pages; track page.path) {
      <a
        class="app-nav-link"
        [routerLink]="page.path"
        routerLinkActive="app-nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon class="app-nav-icon">{{ page.icon }}</mat-icon>
        <span>{{ i18n.t(page.key, page.label) }}</span>
      </a>
    }
  </nav>

  <span class="app-spacer"></span>

  <!-- A new message in a window of its own, over whatever page is open —
       Gmail's Compose. As many as wanted; the service keeps them. -->
  <button
    matButton="tonal"
    type="button"
    class="app-compose"
    [attr.aria-label]="i18n.t('app.compose', 'Compose')"
    (click)="compose()"
  >
    <mat-icon>edit</mat-icon>
    <span class="app-compose__label">{{ i18n.t('app.compose', 'Compose') }}</span>
  </button>

  <div language-menu></div>

  <button matIconButton type="button" [attr.aria-label]="themeLabel()" (click)="toggleTheme()">
    <mat-icon>{{ theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<main class="app-main">
  <router-outlet />
</main>
