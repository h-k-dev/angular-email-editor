<!-- The title bar: the handle a window is dragged by along the edge, and —
     its title is a button — the switch between minimized and open. Gone
     where the window IS the page (a phone, unless its opener asked for a
     window there): the message needs no name over itself, and its own bar
     carries the way back. -->
@if (!bare()) {
  <header
    class="compose-window__bar"
    [class.compose-window__bar--movable]="movable()"
    (pointerdown)="grab($event)"
    (pointermove)="drag($event)"
    (pointerup)="drop($event)"
    (pointercancel)="drop($event)"
  >
    <button
      type="button"
      class="compose-window__title"
      [id]="titleId()"
      [attr.aria-expanded]="!minimized()"
      (click)="toggleMinimized()"
    >
      {{ sheet.message().subject.trim() || ('composeWindow.new' | translate) }}
    </button>

    <span class="compose-window__controls" data-slot="controls">
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="
          minimized()
            ? ('composeWindow.restore' | translate)
            : ('composeWindow.minimize' | translate)
        "
        [title]="
          minimized()
            ? ('composeWindow.restore' | translate)
            : ('composeWindow.minimize' | translate)
        "
        (click)="toggleMinimized()"
      >
        <mat-icon>{{ minimized() ? 'expand_less' : 'minimize' }}</mat-icon>
      </button>
      @if (!viewport.compact()) {
        <button
          mat-icon-button
          type="button"
          [attr.aria-label]="
            expanded()
              ? ('composeWindow.collapse' | translate)
              : ('composeWindow.expand' | translate)
          "
          [title]="
            expanded()
              ? ('composeWindow.collapse' | translate)
              : ('composeWindow.expand' | translate)
          "
          (click)="toggleExpanded()"
        >
          <mat-icon>{{ expanded() ? 'close_fullscreen' : 'open_in_full' }}</mat-icon>
        </button>
      }
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="'composeWindow.close' | translate"
        [title]="'composeWindow.close' | translate"
        (click)="close()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </span>
  </header>
}

<!-- The message: a sheet of its own, no draft kept (the page's draft is
     the page's), no source pane beside it. As a page it has no control of
     its own to leave by — the phone's back button is the way out (the
     window guards it, and its forward button brings the message back),
     which is the one every other page there is left by, and the sheet keeps
     its own Discard for throwing the message away.
     Zoomed, it is a document: the writer's bar heads it, above From, as on
     a phone — the window's own bar, at the window's size, moved. -->
<div
  message-form
  #sheet
  class="compose-window__sheet"
  fields="material"
  [seed]="seed()"
  [initialFocus]="window().focus"
  [bar]="expanded() ? 'top' : 'auto'"
  (sent)="sent()"
  (discarded)="close()"
></div>
