<!-- The View, as two check options. Opens away from the sheet's edge,
     lined up with the bar's near end (`side`, `align`: the sheet's call).
     A pick closes the menu; the sheet changes behind it. -->
<button
  mat-icon-button
  type="button"
  [attr.aria-label]="'composer.more' | translate"
  [title]="'composer.more' | translate"
  ngMenuTrigger
  #moreTrigger="ngMenuTrigger"
  [menu]="moreMenu.menu()"
>
  <mat-icon>more_vert</mat-icon>
</button>
<div
  toolbar-menu
  #moreMenu
  [label]="'composer.more' | translate"
  [trigger]="moreTrigger"
  [side]="side()"
  [align]="align()"
  [items]="items()"
  (selected)="sheet.onEditorView($event)"
></div>
