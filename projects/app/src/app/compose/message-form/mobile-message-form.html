<!-- The writer is the form, as on the desktop sheet (message-form.html):
     Send on its bar, every field of the one message bound to the same
     `envelope`, and the attachment zone for anything dropped on it.
     On a phone the bar heads the sheet, mirrored, at the app's tap size, and
     the whole sheet scrolls (`scroll="sheet"`): the bar and the rows go up
     and away above the text. -->
<form
  email-writer
  emailAddressDragGroup
  [formRoot]="envelope"
  bar="top"
  scroll="sheet"
  aria-label="Email writer"
  dropZone
  #writerZone="dropZone"
  selfOnly
  [clickable]="false"
  [directory]="false"
  [multiple]="true"
  (fileDrop)="onAttachmentDrop($event)"
>
  <!-- Across from Send, at the bar's start: Discard at the edge, the
       frame's actions, Parse (while the body holds placeholders). -->
  <ng-container ngProjectAs="[actions]">
    <button
      mat-icon-button
      type="button"
      aria-label="Discard draft"
      title="Discard draft"
      (click)="discard()"
    >
      <mat-icon>delete</mat-icon>
    </button>
    <ng-content select="[actions]" />
    @if (fillOffered()) {
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="'editor.actions.resolve-placeholders.title' | translate"
        [title]="'editor.actions.resolve-placeholders.title' | translate"
        emailAction="resolve-placeholders"
        [emailActionFrom]="actions"
      >
        <mat-icon>data_object</mat-icon>
      </button>
    }
  </ng-container>

  <!-- Beside Send, at the bar's end: ⋮ (Settings… and the View, opening
       down, lined up with the end), the frame's leading controls, Attach. -->
  <ng-container ngProjectAs="[leading]">
    <message-menu side="below" align="end" />
    <ng-content select="[leading]" />
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="'composer.attach' | translate"
      [title]="'composer.attach' | translate"
      (click)="writerZone.openFilePicker($event)"
    >
      <mat-icon>attach_file</mat-icon>
    </button>
  </ng-container>

  <div
    envelope-rows
    envelope
    [form]="envelope"
    [fields]="fields()"
    [initialFocus]="initialFocus()"
    [plainText]="plainText()"
  ></div>

  <!-- The editor, as on the desktop sheet — but it hands its scrolling to
       the sheet (`scroll="host"`), so its floating foot sticks to the bottom
       of the screen; its toolbar is always shown — it is the bar on the
       keyboard — and its suggestion menu is docked over that bar
       (`suggestions="docked"`): by the caret there is no room. -->
  <section
    email-compose
    [attr.cdkFocusInitial]="initialFocus() === 'body' ? '' : null"
    [attr.tabindex]="initialFocus() === 'body' ? -1 : null"
    [formField]="envelope.html"
    [(quoted)]="quoted"
    (send)="send()"
    (placeholdersFilled)="placeholdersFilled($event)"
    (placeholdersFailed)="placeholdersFailed()"
    (fileDrop)="onAttachmentDrop($event)"
    [toolbar]="!plainText()"
    scroll="host"
    suggestions="docked"
    [format]="bodyFormat()"
    [colorScheme]="editorScheme()"
    [layoutInteraction]="layoutInteraction()"
    [placeholder]="placeholders()"
    aria-label="Email editor"
  >
    <!-- One line, scrolled sideways (and dragged, with a mouse) once the
         chips outgrow it — or two, in reading order, when the rows toggle
         says so (kept by this browser); the strip's height runs across the
         switch, as the AI chat's dock does (heightSwitch). The menu floats
         over the strip's top corner, shown on hover (always without one),
         while the chips do not fit one line or two rows are on. -->
    <div
      below-body
      class="attachment-strip"
      [attr.data-rows]="attachmentRows()"
      [hidden]="!envelope.attachments().value().length"
      [heightSwitch]="attachmentRows()"
      hoverLinger
    >
      <overflow-row #strip>
        <ul
          email-attachment-chips
          [formField]="envelope.attachments"
          [style.--attachment-columns]="attachmentColumns()"
        >
          @for (attachment of envelope.attachments().value(); track attachment.key) {
            <li
              email-attachment-chip
              [attachment]="attachment"
              [status]="uploads.status(attachment.key)()"
              [progress]="uploads.progress(attachment.key)()"
              [aria-disabled]="envelope.attachments().disabled()"
              animate.enter="email-attachment-chip-enter"
              animate.leave="email-attachment-chip-leave"
              activatable
              (removed)="uploads.cancel(attachment.key)"
              (activated)="attachmentClicked(attachment)"
            >
              <mat-icon *emailAttachmentIcon="let kind = kind" inline>
                {{ attachmentIcons[kind] }}
              </mat-icon>
              <!-- The icon button slot, filled with the app's own icon button:
                   the chip shows it over the icon on hover, and its click
                   is the download (faked here). -->
              <button
                *emailAttachmentIconButton="let file; let disabled = disabled"
                mat-icon-button
                type="button"
                class="attachment-chip__download"
                [disabled]="disabled"
                [attr.aria-label]="
                  ('composer.attachments.download' | translate) + ' ' + file.name
                "
                (click)="downloadAttachment(attachment)"
              >
                <mat-icon>download</mat-icon>
              </button>
            </li>
          }
        </ul>
      </overflow-row>
      <!-- The float menu, in reading order: how many attachments there are
           (a document and the number — a label, not a control: the list says
           it to a screen reader already), the trash (all of them, at once),
           and the rows toggle (while the chips do not fit one line, or two rows
           are on). -->
      <div
        class="attachment-strip__menu"
        role="group"
        [attr.aria-label]="'composer.attachments.label' | translate"
      >
        <span class="attachment-strip__count" aria-hidden="true">
          <mat-icon>description</mat-icon>
          {{ attachmentCount() }}
        </span>
        <button
          mat-icon-button
          type="button"
          class="attachment-strip__clear"
          [disabled]="envelope.attachments().disabled()"
          [attr.aria-label]="'composer.attachments.removeAll' | translate"
          [matTooltip]="'composer.attachments.removeAll' | translate"
          matTooltipPosition="above"
          (click)="removeAttachments()"
        >
          <mat-icon>delete</mat-icon>
        </button>
        @if (strip.overflows() || attachmentRows() === 'two') {
          <button
            type="button"
            class="attachment-strip__rows"
            [attr.aria-pressed]="attachmentRows() === 'two'"
            [attr.aria-label]="'composer.attachments.twoRows' | translate"
            [matTooltip]="'composer.attachments.twoRows' | translate"
            matTooltipPosition="above"
            (click)="toggleAttachmentRows()"
          >
            <dots-morph [grid]="attachmentRows() === 'two'" />
          </button>
        }
      </div>
    </div>
  </section>
</form>
