<!-- The dialog, for the composer's one popover: the field over the image. -->
<ng-template #panel>
  <div
    class="alt-text-editor"
    role="dialog"
    [attr.aria-label]="i18n.t('editor.image.altLabel', 'Alt text')"
  >
    <!-- The library does the rest: the alt in the field, Enter and Escape,
         the caret back to the editor. `dir="auto"`: an alt in a
         right-to-left script reads the right way round. -->
    <input
      class="alt-text-editor__input"
      type="text"
      dir="auto"
      [attr.aria-label]="i18n.t('editor.image.altLabel', 'Alt text')"
      [placeholder]="i18n.t('editor.image.altPlaceholder', 'Describe the image')"
      [emailImageAlt]="editor()"
      #alt="emailImageAlt"
      (emailImageAltClosed)="open.set(false)"
    />
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="i18n.t('editor.image.applyAlt', 'Apply alt text')"
      (click)="alt.apply()"
    >
      <mat-icon>check</mat-icon>
    </button>
  </div>
</ng-template>
