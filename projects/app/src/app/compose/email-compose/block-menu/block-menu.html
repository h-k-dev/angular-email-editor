<!-- The menu, for the composer's one popover. Escape is ours: it returns
     focus to the text and leaves the menu up, because the cursor is still
     in the block. -->
<ng-template #panel>
  <div
    class="block-menu"
    #menu
    role="toolbar"
    [attr.aria-label]="state().block === 'section' ? 'Section' : 'Columns'"
    emailKeepFocus
    (keydown.escape)="leave()"
  >
    @if (state().block === 'section') {
      <!-- A band's one structural act: taking it away, the content staying.
           Its fill is the toolbar's colour button, like a cell's. -->
      <button
        mat-icon-button
        type="button"
        aria-label="Remove section"
        title="Remove the section, keeping its content"
        (click)="run('removeSection')"
      >
        <mat-icon>delete_outline</mat-icon>
      </button>
    } @else {
      <button mat-icon-button type="button" aria-label="Add column" (click)="run('addColumn')">
        <mat-icon>add</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        aria-label="Remove column"
        (click)="run('removeColumn')"
      >
        <mat-icon>remove</mat-icon>
      </button>

      <mat-divider [vertical]="true" />

      <button
        mat-icon-button
        type="button"
        aria-label="Delete columns"
        (click)="run('deleteColumns')"
      >
        <mat-icon>delete_outline</mat-icon>
      </button>
    }
  </div>
</ng-template>
