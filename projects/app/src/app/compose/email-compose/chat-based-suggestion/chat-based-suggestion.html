<!-- The bar, above the formatting toolbar while a proposal is up: the ways
     out over the text, then the chat. The library's keys directive hears
     the page while the proposal stands: Ctrl-Enter (⌘-Enter) applies it,
     Escape is ours to decide. -->
@if (open()) {
  <div
    class="chat-based-suggestion"
    role="region"
    [attr.aria-label]="'editor.ai.dialog' | translate"
    [attr.aria-busy]="proposal.streaming()"
    [emailProposalKeys]="proposal"
    (accepted)="applied()"
    (escape)="escape($event)"
  >
    <!-- On nothing: the thinking on the left, the decision on the right. -->
    <div class="chat-based-suggestion__top">
      @if (proposal.thinking()) {
        <div
          class="chat-based-suggestion__thinking"
          role="status"
          [attr.aria-label]="'editor.ai.thinking' | translate"
        >
          <span></span><span></span><span></span>
        </div>
      }
      <span class="chat-based-suggestion__space"></span>
      <!-- The library's triggers, as words: Discard takes the proposal out,
           Apply takes it in — as it stands. Disabled by the bar's own means,
           from their state. -->
      <button
        type="button"
        class="chat-based-suggestion__word"
        [emailProposalDiscard]="proposal"
        #discard="emailProposalDiscard"
        [disabled]="discard.disabled()"
        (click)="close()"
      >
        {{ 'editor.ai.discard' | translate }}
      </button>
      <button
        type="button"
        class="chat-based-suggestion__word"
        [emailProposalAccept]="proposal"
        #apply="emailProposalAccept"
        [disabled]="apply.disabled()"
        (click)="applied()"
      >
        {{ 'editor.ai.apply' | translate }}
      </button>
    </div>

    <!-- The strip: the library's chat input (lines and lists, Enter sends),
         rising out of the bar as it opens (`animate.enter`, see the
         stylesheet) — and the button, unless the toolbar has it. -->
    <div class="chat-based-suggestion__field" animate.enter="chat-based-suggestion__field--rising">
      <div
        email-chat-input
        class="chat-based-suggestion__chat"
        [placeholder]="'editor.ai.prompt' | translate"
        [label]="'editor.ai.instructions' | translate"
        [(value)]="instructions"
        (sent)="ask($event)"
      ></div>
      @if (!actionInToolbar()) {
        <ng-container *ngTemplateOutlet="action" />
      }
    </div>
  </div>
}

<!-- The one button, by what there is to do: stop while the assistant
     writes, send once there is text, and until then a place for voice
     input — kept, nothing behind it yet. Each comes in where it lands
     (`animate.enter`) — in the strip, or at the toolbar's end when the
     toolbar switches on and takes it. -->
<ng-template #action>
  @if (busy()) {
    <button
      type="button"
      animate.enter="chat-based-suggestion__icon--entering"
      class="chat-based-suggestion__icon chat-based-suggestion__send"
      [attr.aria-label]="'editor.ai.stop' | translate"
      (click)="stop()"
    >
      <mat-icon>stop</mat-icon>
    </button>
  } @else if (canSend()) {
    <button
      type="button"
      animate.enter="chat-based-suggestion__icon--entering"
      class="chat-based-suggestion__icon chat-based-suggestion__send"
      [attr.aria-label]="'editor.ai.send' | translate"
      (click)="ask()"
    >
      <mat-icon>arrow_upward</mat-icon>
    </button>
  } @else {
    <button
      type="button"
      animate.enter="chat-based-suggestion__icon--entering"
      class="chat-based-suggestion__icon"
      [attr.aria-label]="'editor.ai.voice' | translate"
      disabled
    >
      <mat-icon>mic</mat-icon>
    </button>
  }
</ng-template>
