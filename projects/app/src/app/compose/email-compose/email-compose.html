<!-- What floats over the text: the link editor at the selection (opened by
     the link items through the commands), the bubble menu on a selection
     and the block menu on a bare cursor in a layout block (placed by their
     extensions). All three render in the CDK overlay container; here they
     take no room. -->
<div link-editor></div>
<div bubble-menu [state]="bubbleMenuState()"></div>
<div block-menu [state]="blockMenuState()"></div>

<!-- The body: the editing surface, or the source in its place, and the hint
     that overlays whichever shows. A wrapper because the hint has to cover
     the surface without scrolling with it — an overlay inside a scroll
     container covers only its first screen. -->
<div class="body">
  <!-- The editing surface is the attachment dropzone (see `fileDrop`).
       clickable=false: a click on the paper must never open a file picker. -->
  <div
    class="editor scroll-container"
    #editorHost
    dropZone
    #attachmentZone="dropZone"
    [clickable]="false"
    [directory]="false"
    [multiple]="true"
    (fileDrop)="fileDrop.emit($event)"
    [hidden]="codeView()"
  >
    <!-- {{ autocomplete: the slash menu's sibling for personalization tokens.
         Items stream in pages from the host's source; scrolling near the end
         (or ArrowDown on the last row) fetches the next page. -->
    <div
      class="slash-menu merge-tag-menu"
      #mergeTagMenu
      role="listbox"
      aria-label="Personalization tokens"
      (scroll)="onMergeMenuScroll()"
    >
      @if (mergeMenuState(); as tags) {
        @for (item of tags.items; track item.path; let i = $index) {
          <button
            type="button"
            role="option"
            class="slash-item"
            [class.is-active]="i === tags.activeIndex"
            [attr.aria-selected]="i === tags.activeIndex"
            (click)="tags.select(item)"
          >
            {{ item.label || item.path }}
            <span class="merge-menu__path">{{ '{{' + item.path + '}}' }}</span>
          </button>
        }
        @if (tags.loading || tags.loadingMore) {
          <div class="merge-menu__status" role="status">
            {{ tags.loading ? 'Searching…' : 'Loading more…' }}
          </div>
        }
      }
    </div>

    <div class="slash-menu" #slashMenu role="listbox" aria-label="Insert block">
      @if (slashState(); as slash) {
        @for (item of slash.items; track item.title; let i = $index) {
          <button
            type="button"
            role="option"
            class="slash-item"
            [class.is-active]="i === slash.activeIndex"
            [attr.aria-selected]="i === slash.activeIndex"
            (click)="slash.select(item)"
          >
            @if (item.icon) {
              <mat-icon>{{ item.icon }}</mat-icon>
            }
            {{ item.title }}
          </button>
        }
      }
    </div>
  </div>

  <!-- Code view: the composer's HTML source pane lands here, moved in as a
       DOM portal (never re-created — its editor, undo history and lint carry
       over) and moved back out when the view switches. -->
  <div class="code" [hidden]="!codeView()">
    <ng-template [cdkPortalOutlet]="codePortal()" />
  </div>

  <!-- The surface's hint. Over the surface, not inside it — see `.body`.
       Two states, and the zone knows only one: a file drag it would take
       (`isDragOver`), which attaches. The other — an image drag, which the
       editor takes and the zone therefore never sees — comes from the editor
       itself (`imageDrag`). -->
  <div
    drop-hint
    [active]="imageDrag() || attachmentZone.isDragOver()"
    [art]="surfaceHint().art"
    [heading]="surfaceHint().heading"
    [text]="surfaceHint().text"
  ></div>
</div>

<!-- A slot between the body and the toolbar, for whatever the host wants to
     hang under the message — the attachment strip today. Named for the
     position, not the content: the composer reserves the room and stays
     ignorant of what fills it, which is what keeps envelope concerns
     (attachments among them) out of the editor component. -->
<ng-content select="[below-body]" />

<!-- The formatting toolbar sits *below* the editing surface: on a phone the
     shell's height follows the virtual keyboard (see app.scss), so the bar
     rides up and stays reachable right above the keys. Last in DOM as on
     screen. The host can hide it (`toolbar`, the writer bar's formatting
     button). -->
<div formatting-toolbar aria-label="Text formatting" [shown]="toolbar()"></div>
