<!-- The menu, for the composer's one popover: one toolbar, its tools by
     what is selected. The `@switch` swaps the row of tools inside it — the
     toolbar element, and the popover around it, stay; the row that comes
     in fades in (`animate.enter`, see the stylesheet). -->
<ng-template #panel>
  <div
    class="bubble-menu"
    role="toolbar"
    appToolbarKeys
    [attr.aria-label]="menuLabel()"
    emailKeepFocus
  >
    @switch (state().kind) {
      @case ('image') {
        <div class="bubble-menu__tools" animate.enter="bubble-menu__tools--in">
          <!-- The alt leads, as words: what it says, or that it is missing. -->
          <button
            mat-button
            type="button"
            class="bubble-menu__alt"
            [class.bubble-menu__alt--missing]="!alt()"
            aria-haspopup="dialog"
            [attr.aria-label]="altLabel()"
            [emailAction]="actions.get(altItem.id)"
            #altTrigger="emailAction"
            [disabled]="altTrigger.disabled()"
          >
            <span class="bubble-menu__alt-text" dir="auto">{{
              alt() || i18n.t('editor.image.addAlt', 'Add alt text')
            }}</span>
          </button>
          <ng-container
            *ngTemplateOutlet="buttons; context: { $implicit: imageEntries, lead: true }"
          />
        </div>
      }
      @case ('button') {
        <div class="bubble-menu__tools" animate.enter="bubble-menu__tools--in">
          <ng-container
            *ngTemplateOutlet="buttons; context: { $implicit: buttonEntries, lead: false }"
          />
        </div>
      }
      @default {
        <div class="bubble-menu__tools" animate.enter="bubble-menu__tools--in">
          <ng-container *ngTemplateOutlet="buttons; context: { $implicit: entries, lead: false }" />
        </div>
      }
    }
  </div>
</ng-template>

<!-- A run of buttons, divided by group; `lead` when something stands
     before the first group, so it gets a divider too. -->
<ng-template #buttons let-entries let-lead="lead">
  @for (entry of entries; track entry.item.id; let first = $first) {
    @let item = entry.item;
    @if (entry.separated || (first && lead)) {
      <mat-divider [vertical]="true" />
    }
    <!-- Every button here is an action — the kit's marks, quote, alignment
         and image tools, the composer's own link — so the library's
         directive does the work on Material's button: it runs on click,
         says pressed, hands the caret back; how disabled looks stays
         Material's, bound from its state. -->
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="label(item)"
      [emailAction]="actions.get(item.id)"
      #trigger="emailAction"
      [disabled]="trigger.disabled()"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
    </button>
  }
</ng-template>
