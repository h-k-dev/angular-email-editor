<!-- The anchor: an element kept over the selection's box, for the overlay to
     attach to. -->
<span [emailAnchor]="state().boundingBox" cdkOverlayOrigin #origin="cdkOverlayOrigin"></span>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="state().isOpen"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayHasBackdrop]="false"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  cdkConnectedOverlayTransformOriginOn=".bubble-menu"
>
  <!-- Lands softly (`animate.enter`, see the stylesheet), growing out of the
       side that faces the selection — the CDK sets the transform origin for
       whichever position it chose. -->
  <div
    class="bubble-menu"
    animate.enter="bubble-menu--landing"
    role="toolbar"
    aria-label="Selection formatting"
    emailKeepFocus
  >
    @for (entry of entries; track entry.item.id) {
      @let item = entry.item;
      @if (entry.separated) {
        <mat-divider [vertical]="true" />
      }
      <!-- Every button here is an action — the kit's marks and quote, the
           composer's own link — so the library's directive does the work on
           Material's button: it runs on click, says pressed, hands the caret
           back; how disabled looks stays Material's, bound from its state. -->
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="item.label"
        [emailAction]="actions.get(item.id)"
        #trigger="emailAction"
        [disabled]="trigger.disabled()"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
      </button>
    }
  </div>
</ng-template>
