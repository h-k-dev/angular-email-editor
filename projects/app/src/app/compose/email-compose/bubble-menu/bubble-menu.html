<!-- The anchor: an element kept over the selection's box, for the overlay to
     attach to. -->
<span [emailAnchor]="state().boundingBox" cdkOverlayOrigin #origin="cdkOverlayOrigin"></span>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="state().isOpen"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayHasBackdrop]="false"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  cdkConnectedOverlayTransformOriginOn=".bubble-menu"
>
  <!-- Lands softly (`animate.enter`, see the stylesheet), growing out of the
       side that faces the selection — the CDK sets the transform origin for
       whichever position it chose. -->
  <!-- One menu, a set of tools per thing selected: an image alone and a
       button get their own (the extension says which, `kind`), anything
       else the marks. -->
  @if (state().kind === 'image') {
    <div
      class="bubble-menu"
      animate.enter="bubble-menu--landing"
      role="toolbar"
      appToolbarKeys
      [attr.aria-label]="i18n.t('editor.image.menu', 'Image options')"
      emailKeepFocus
    >
      <!-- The alt leads, as words: what it says, or that it is missing. -->
      <button
        mat-button
        type="button"
        class="bubble-menu__alt"
        [class.bubble-menu__alt--missing]="!alt()"
        aria-haspopup="dialog"
        [attr.aria-label]="altLabel()"
        [emailAction]="actions.get(altItem.id)"
        #altTrigger="emailAction"
        [disabled]="altTrigger.disabled()"
      >
        <span class="bubble-menu__alt-text" dir="auto">{{
          alt() || i18n.t('editor.image.addAlt', 'Add alt text')
        }}</span>
      </button>
      <ng-container *ngTemplateOutlet="buttons; context: { $implicit: imageEntries, lead: true }" />
    </div>
  } @else if (state().kind === 'button') {
    <div
      class="bubble-menu"
      animate.enter="bubble-menu--landing"
      role="toolbar"
      appToolbarKeys
      [attr.aria-label]="i18n.t('editor.button.menu', 'Button options')"
      emailKeepFocus
    >
      <ng-container
        *ngTemplateOutlet="buttons; context: { $implicit: buttonEntries, lead: false }"
      />
    </div>
  } @else {
    <div
      class="bubble-menu"
      animate.enter="bubble-menu--landing"
      role="toolbar"
      appToolbarKeys
      [attr.aria-label]="i18n.t('editor.menu.selection', 'Selection formatting')"
      emailKeepFocus
    >
      <ng-container *ngTemplateOutlet="buttons; context: { $implicit: entries, lead: false }" />
    </div>
  }
</ng-template>

<!-- A run of buttons, divided by group; `lead` when something stands
     before the first group, so it gets a divider too. -->
<ng-template #buttons let-entries let-lead="lead">
  @for (entry of entries; track entry.item.id; let first = $first) {
    @let item = entry.item;
    @if (entry.separated || (first && lead)) {
      <mat-divider [vertical]="true" />
    }
    <!-- Every button here is an action — the kit's marks, quote, alignment
         and image tools, the composer's own link — so the library's
         directive does the work on Material's button: it runs on click,
         says pressed, hands the caret back; how disabled looks stays
         Material's, bound from its state. -->
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="label(item)"
      [emailAction]="actions.get(item.id)"
      #trigger="emailAction"
      [disabled]="trigger.disabled()"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
    </button>
  }
</ng-template>
