<!-- The anchor: an element kept at the selection's coordinates — a line, no
     width — for the overlay to attach to. -->
<span [emailAnchor]="anchor()" cdkOverlayOrigin #origin="cdkOverlayOrigin"></span>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayDisableClose]="true"
  (overlayKeydown)="onKeydown($event)"
  (detach)="closed()"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
>
  <div
    class="link-editor"
    role="dialog"
    [attr.aria-label]="i18n.t('editor.link.dialog', 'Edit link')"
  >
    <!-- The field and Apply are one signal form: Apply is its submit. -->
    <form class="link-editor__form" [formRoot]="linkForm" novalidate>
      <!-- A URL reads left to right in every language: `dir="ltr"`, so an
           address in a right-to-left interface keeps its order. The
           placeholder is a hint, not a name — the label is its own. -->
      <input
        #input
        class="link-editor__input"
        type="text"
        inputmode="url"
        dir="ltr"
        spellcheck="false"
        autocomplete="off"
        [formField]="linkForm.href"
        [attr.aria-label]="i18n.t('editor.link.url', 'Link URL')"
        [attr.aria-invalid]="refused() ? true : null"
        [placeholder]="i18n.t('editor.link.url', 'Link URL')"
        (keydown.enter)="onEnter($event)"
      />
      <!-- The three actions, always: apply, go to the link, take it off. -->
      <button
        mat-icon-button
        type="submit"
        [attr.aria-label]="i18n.t('editor.link.apply', 'Apply link')"
      >
        <mat-icon>check</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="i18n.t('editor.link.open', 'Open link')"
        (click)="visit()"
      >
        <mat-icon>open_in_new</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="i18n.t('editor.link.remove', 'Remove link')"
        (click)="remove()"
      >
        <mat-icon>link_off</mat-icon>
      </button>
    </form>
    <!-- A button's one menu is this popover (its bubble stands aside), so
         where it sits on its line is set here too — the paragraph's
         alignment, as the toolbar sets it. The kit's actions, pressed where
         they are on. -->
    @if (forButton()) {
      <mat-divider [vertical]="true" />
      @for (item of alignItems; track item.id) {
        <button
          mat-icon-button
          type="button"
          [attr.aria-label]="label(item)"
          [emailAction]="actions.get(item.id)"
          #align="emailAction"
          [disabled]="align.disabled()"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
        </button>
      }
    }
  </div>
</ng-template>
