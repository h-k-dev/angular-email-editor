<!-- The bar's parts, each drawn once and laid out by the bar below. -->
<!-- The form's submit button: Send, as the word — the one thing the message
     is for, where a mail app puts it, and read at a glance the way no glyph
     is. A filled button, the bar's height; on the text edge (the
     stylesheet).
     While the submission runs the button stays live — focusable, and its
     tooltip still reachable — and shows a spinner over the word instead of
     greying out. Pressing it again is harmless: the form ignores a submit
     while one is running, whichever gesture it comes from. -->
<ng-template #send>
  <button
    matButton="filled"
    type="submit"
    class="writer-bar__send"
    title="Send (Ctrl+Enter)"
    [attr.aria-label]="submitting() ? 'Sending' : 'Send'"
    [showProgress]="submitting()"
  >
    Send
    <!-- The spinner's size: Material sizes only the svg, and the element
         keeps its diameter as an inline size — left at the default 100px
         it hangs out of the bar. -->
    <mat-progress-spinner progressIndicator mode="indeterminate" [diameter]="20" />
  </button>
</ng-template>

<!-- The host's view controls, beside Send — away from the actions that do
     something to the message. -->
<ng-template #leading><ng-content select="[leading]" /></ng-template>

<!-- The host's own actions, Discard among them, across from Send. -->
<ng-template #actions><ng-content select="[actions]" /></ng-template>

<!-- The bar, placed by `bar` — by default the viewport's: on a phone it
     heads the sheet, on anything wider it closes it, under the composer's
     formatting toolbar; a frame may head the sheet with it anywhere (the
     zoomed window). At the foot Send opens the row and the actions close
     it; heading the sheet the row is mirrored — the actions first, Send at
     the end, under the thumb on a phone and where the eye ends a header
     (`barOnTop`; the host mirrors its own actions to match).
     The nodes move rather than being restyled, so the reading and Tab order
     always follow what is on screen. -->
<ng-template #bar>
  @if (barOnTop()) {
    <ng-container [ngTemplateOutlet]="actions" />
    <span class="writer-bar__spacer"></span>
    <ng-container [ngTemplateOutlet]="leading" />
    <ng-container [ngTemplateOutlet]="send" />
  } @else {
    <ng-container [ngTemplateOutlet]="send" />
    <ng-container [ngTemplateOutlet]="leading" />
    <span class="writer-bar__spacer"></span>
    <ng-container [ngTemplateOutlet]="actions" />
  }
</ng-template>

@if (barOnTop()) {
  <header class="writer-bar">
    <ng-container [ngTemplateOutlet]="bar" />
  </header>
}

<!-- The envelope: the rows the host marks `envelope` — From, To, Subject —
     stacked flush, hairline to hairline, as one block of the column. -->
<div class="writer-envelope">
  <ng-content select="[envelope]" />
</div>

<!-- The body: everything else the host projects, the editor first. -->
<ng-content />

@if (!barOnTop()) {
  <footer class="writer-bar">
    <ng-container [ngTemplateOutlet]="bar" />
  </footer>
}
