<!-- Three nested dropzones, one rule each, and a hint apiece that says the
     rule at the moment it matters:
       · the page — everything outside the message — *imports*: an .eml
         dropped here is parsed and rendered into the editor;
       · the writer — the message, address rows to toolbar — *attaches*,
         whatever the file (the zone is on the writer form below);
       · the editing surface inside it, the text, *embeds* a drop of nothing
         but images and attaches anything else (email-compose.html).

     `selfOnly` is what keeps them apart: a drag that lands in a nested zone
     is structurally never the outer one's — regardless of stacking, and
     regardless of what that zone does with the drop. Before
     angular-file-drop 1.2 this had to be done by keeping the zone painted
     *under* the panes, which broke the moment it was given a position. -->
<!-- Home: the mailbox, one way — the page's only way out, in the sheet's
     bar next to ⋮. -->
<ng-template #home>
  <a
    mat-icon-button
    routerLink="/inbox"
    [attr.aria-label]="'app.nav.mailbox' | translate"
    [matTooltip]="'app.nav.mailbox' | translate"
    matTooltipPosition="below"
  >
    <mat-icon>home</mat-icon>
  </a>
</ng-template>

<div
  class="compose__page"
  dropZone
  #emlZone="dropZone"
  selfOnly
  [clickable]="false"
  [directory]="false"
  [multiple]="false"
  [acceptedFiles]="'.eml,message/rfc822'"
  (fileDrop)="onEmlDrop($event)"
>
  <!-- The import hint. Inside the zone now that the zone is an ancestor, and
       click-through so it can cover the sheet without taking a drop from it. -->
  <div
    drop-hint
    art="import"
    heading="Drop to open this message"
    text="The .eml is parsed and rendered into the editor, replacing what is written. To send a message along instead, drop it on the message — it becomes an attachment."
    [active]="emlZone.isDragOver()"
  ></div>

  <!-- The message: the sheet every message in the app is written on (the
     compose windows hold one each), laid out as the zoomed window lays it
     out — a document (`layout`): the bar heading it, a centred column, paper
     edge to edge — with its rows as a window draws them (`fields`) and Send
     an icon button like the bar's others (`sendButton`, the phone's too). Nothing docks beside
     it. This page keeps it as the draft; the writer inside is
     the *attachment* zone, selfOnly, so a drop on the message is never this
     page's import.
     The sheet is a paper island in its own Appearance, as every compose
     window is (paper-island.ts): bar, rows, text and their menus one paper.
     Opened on a phone, the page writes on the phone's sheet instead
     (`mobile`, chosen once): the screen. The desk is where a layout is
     shaped (`mode="design"`: its blocks take their gestures); the phone's
     sheet, like every compose window, writes. Its HTML source shows in the
     editor's place (`sourceViews`: the settings' View).
     The page's one way out is home, to the mailbox — in the sheet's bar
     next to ⋮, on a desk and a phone alike.
     A new message here comes addressed (`newMessage`, the page's welcome)
     and opens with the caret in the text, so the page is one keystroke from
     a message. What a send or an import did is said the way a window says
     it, in a snackbar. -->
  @if (mobile) {
    <div
      mobile-message-form
      #phoneSheet
      [paperIsland]="phoneSheet.editorScheme()"
      [newMessage]="welcome"
      initialFocus="body"
      keepDraft
      sendButton="icon"
      (sent)="sent()"
    >
      <ng-container ngProjectAs="[exit]" [ngTemplateOutlet]="home" />
    </div>
  } @else {
    <div
      message-form
      #deskSheet
      [paperIsland]="deskSheet.editorScheme()"
      [newMessage]="welcome"
      initialFocus="body"
      keepDraft
      layout="document"
      fields="material"
      sendButton="icon"
      mode="design"
      [(sourceView)]="sourceView"
      sourceViews
      [codePortal]="codePortal()"
      [codeEditor]="sourcePane().editor()"
      (sent)="sent()"
    >
      <ng-container ngProjectAs="[exit]" [ngTemplateOutlet]="home" />
    </div>
  }
  <!-- The HTML source pane: hidden here, its only view the editor's place —
     in code view a DOM portal moves the very same node into the composer's
     editing surface and back, so the editor inside is never re-created and
     undo history and lint carry across. -->
  <section
    html-email-compose
    #sourceEl
    class="email-scroll"
    [hidden]="sourceView() !== 'code'"
    [active]="sourceView() === 'code'"
    [html]="html()"
    (htmlChange)="onSourceHtml($event)"
    aria-label="Email HTML source"
  ></section>
</div>
