<!-- The list's half: its header, and the list under it (`InboxList`) — on
     the app's own surface, whatever paper the mail is read on. -->
<div class="inbox-side">
  <header page-header></header>
  <app-inbox-list id="inbox-list" class="email-scroll" [open]="open()" />
</div>

<!-- The divider: a line that fades out at both ends, and a handle — drag
     it, or focus it and use the arrows, and the list follows. -->
<div
  class="inbox-divider"
  [(splitHandle)]="listWidth"
  [splitTarget]="grid"
  splitProperty="--inbox-list-width"
  [splitMin]="listMin"
  [splitMax]="listMax"
  [splitKeep]="readerMin"
  aria-controls="inbox-list"
  [attr.aria-label]="'inbox.resize' | translate"
></div>

<!-- The mail's half: paper, header and all — the reading paper
     (`InboxPaper`), light or dark as the reader's button turns it
     (Thunderbird's), never the app's colour. Under the header, the open
     message (`InboxReader`), or a note while none is. Beside the list on a
     desk; on a phone it takes the list's place while a message is open.
     It scrolls as one sheet: the header goes up with the mail. On a phone
     its header leads with the way back to the list, in the aside opener's
     place. -->
<div #pane class="inbox-pane" [paperIsland]="paper()">
  <header page-header [frameLead]="!backButton()">
    @if (backButton()) {
      <button
        matIconButton
        type="button"
        class="inbox-back"
        [attr.aria-label]="'inbox.back' | translate"
        [matTooltip]="'inbox.back' | translate"
        (click)="back()"
      >
        <mat-icon>arrow_back</mat-icon>
      </button>
    }
  </header>
  <div class="inbox-pane__body">
    <router-outlet />
  </div>
</div>

<!-- While a file hangs over the page: what letting go of an .eml does. -->
<div
  drop-hint
  art="import"
  [heading]="'inbox.import.dropHeading' | translate"
  [text]="'inbox.import.dropText' | translate"
  [active]="dragging()"
></div>
