<!-- The list's half: its header, and the list under it — on the app's own
     surface, whatever paper the mail is read on. A row is a link — opening a
     message is a place (`/inbox/:id`), so the browser's back button leaves
     it, and a message can be linked to. -->
<div class="inbox-side">
  <header page-header></header>
  <nav class="inbox-list email-scroll" id="inbox-list" [attr.aria-label]="'inbox.title' | translate">
    <ul>
      @for (row of rows(); track row.mail.id) {
        <li>
          <a
            class="inbox-row"
            [routerLink]="row.mail.id"
            routerLinkActive="inbox-row--open"
            ariaCurrentWhenActive="page"
            [class.inbox-row--unread]="unread().has(row.mail.id)"
          >
            <!-- Proton's leading avatar: the sender's initials on the
                 sender's own hue. Decoration — the name says who. -->
            <span class="inbox-row__avatar" aria-hidden="true" [style.--avatar-hue]="row.hue">
              {{ row.initials }}
            </span>
            <span class="inbox-row__name">{{ row.mail.name }}</span>
            <span class="inbox-row__when">{{ row.when }}</span>
            <span class="inbox-row__subject">{{ row.mail.subject }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>

<!-- The divider: a line that fades out at both ends, and a handle — drag
     it, or focus it and use the arrows, and the list follows. -->
<div
  class="inbox-divider"
  [(splitHandle)]="listWidth"
  [splitTarget]="grid"
  splitProperty="--inbox-list-width"
  [splitMin]="listMin"
  [splitMax]="listMax"
  [splitKeep]="readerMin"
  aria-controls="inbox-list"
  [attr.aria-label]="'inbox.resize' | translate"
></div>

<!-- The mail's half: paper, header and all — the reading paper
     (`InboxPaper`), light or dark as the reader's button turns it
     (Thunderbird's), never the app's colour. Under the header, the open
     message (`InboxReader`), or a note while none is. Beside the list on a
     desk; on a phone it takes the list's place while a message is open.
     It scrolls as one sheet: the header goes up with the mail. -->
<div #pane class="inbox-pane" [paperIsland]="paper()">
  <header page-header></header>
  <div class="inbox-pane__body">
    <router-outlet />
  </div>
</div>
