<doc-page [icon]="link().icon" [trail]="trail()" [toc]="toc">
  <h1 class="doc-title">{{ content().title }}</h1>
  <p class="doc-lede" [docProse]="content().lede"></p>

  <section class="doc-section">
    <ol docSteps>
      <li docStep id="import" lead="Import">
        <doc-code [code]="importLine()" label="" [wrap]="true" />
      </li>

      <li docStep id="playground" lead="Try it">
        <!-- Its own chunk: a page's playground loads with the page. Recreated
             per page, so nothing of one component's bench outlives it — the
             last page's held only while the next one's chunk is on its way. -->
        @if (bench(); as bench) {
          <ng-container *ngComponentOutlet="bench.type; injector: placeInjector()" />
        } @else if (failed()) {
          <p class="doc-text">The playground did not load.</p>
        } @else {
          <div class="components-loading" aria-hidden="true"></div>
        }
      </li>

      <li docStep id="usage" lead="Write it">
        <doc-code [code]="content().usage" [lang]="usageLang()" label="" />
        <ul class="doc-points">
          @for (point of content().points; track $index) {
            <li [docProse]="point"></li>
          }
        </ul>
      </li>
    </ol>
  </section>
</doc-page>
