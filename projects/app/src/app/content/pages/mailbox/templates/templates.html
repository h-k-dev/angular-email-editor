<header page-header>
  <h1 class="gallery-title">{{ 'templates.title' | translate }}</h1>
</header>

<!-- The shelves, YouTube's chips: every template, or one set's — one line
     that scrolls sideways (`overflow-row`) on a narrow screen rather than
     wrapping. They stay on top as the feed scrolls under them. -->
<overflow-row
  class="gallery-shelves"
  rowRole="group"
  [rowLabel]="'templates.shelves' | translate"
  [paddles]="!touch()"
  [dragScroll]="!touch()"
>
  @for (shelf of shelves(); track shelf.id) {
    <button
      type="button"
      class="gallery-shelf"
      [attr.aria-pressed]="shelf.pressed"
      (click)="pick(shelf.key)"
    >
      {{ shelf.label }}
    </button>
  }
</overflow-row>

<!-- The feed: only the rows in view drawn, the next page asked for as its
     end comes near, its skeletons in the card's shape meanwhile. Cards 360px
     at the least and four at the most — a 2K screen holds four, 1080p too,
     the aside open or the rail; a laptop three, a small one two. -->
<virtual-grid
  class="gallery-grid"
  [min]="360"
  [maxColumns]="4"
  [estimate]="340"
  [total]="total()"
  [tint]="tint"
  [label]="'templates.title' | translate"
  [attr.aria-busy]="loading()"
  (endReached)="more()"
>
  <article
    template-card
    *virtualGridItem="let card of cards()"
    [card]="card"
    [hueOf]="card.template.name"
    (changed)="patch($event)"
  ></article>
  <ng-template virtualGridPlaceholder>
    <div class="gallery-ghost">
      <div class="gallery-ghost__thumb"></div>
      <div class="gallery-ghost__meta">
        <div class="gallery-ghost__avatar"></div>
        <div class="gallery-ghost__lines">
          <div class="gallery-ghost__line"></div>
          <div class="gallery-ghost__line gallery-ghost__line--short"></div>
        </div>
      </div>
    </div>
  </ng-template>
</virtual-grid>

@if (empty()) {
  <p class="gallery-empty">{{ 'templates.empty' | translate }}</p>
}
