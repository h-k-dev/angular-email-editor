<!-- The page's header: its 48px on top, kept for what the page will put
     there (`page-header`). -->
<header page-header></header>
<!-- Two 600px boxes on one line — the replica in our editor, the original
   as a client draws it — under a header that serves both, and the stepper
   in its own thin column. -->
<div class="render" [style.--render-box.px]="boxWidth()">
  <header class="render-header">
    <h1 class="render-title">{{ pair()?.name ?? '' }}</h1>
    <div class="render-choice" role="radiogroup" [attr.aria-label]="'render.view' | translate">
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="sourceView() !== 'code'"
        (click)="showSource(false)"
      >
        {{ 'render.editor' | translate }}
      </button>
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="sourceView() === 'code'"
        (click)="showSource(true)"
      >
        {{ 'render.html' | translate }}
      </button>
    </div>
    <span class="render-header-spacer"></span>
    <div
      class="render-choice"
      role="radiogroup"
      [attr.aria-label]="'render.client' | translate"
    >
      @for (client of clients; track client) {
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="client === this.client()"
          (click)="this.client.set(client)"
        >
          {{ clientLabels[client] }}
        </button>
      }
    </div>
    <div
      class="render-choice"
      role="radiogroup"
      [attr.aria-label]="'render.device' | translate"
    >
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="device() === 'desktop'"
        (click)="device.set('desktop')"
      >
        {{ 'render.desktop' | translate }}
      </button>
      <button
        type="button"
        role="radio"
        [attr.aria-checked]="device() === 'phone'"
        (click)="device.set('phone')"
      >
        {{ 'render.phone' | translate }}
      </button>
    </div>
    <div
      class="render-choice"
      role="radiogroup"
      [attr.aria-label]="'render.surface' | translate"
    >
      <button type="button" role="radio" [attr.aria-checked]="!dark()" (click)="dark.set(false)">
        {{ 'render.light' | translate }}
      </button>
      <button type="button" role="radio" [attr.aria-checked]="dark()" (click)="dark.set(true)">
        {{ 'render.dark' | translate }}
      </button>
    </div>
  </header>

  @if (pair(); as pair) {
    <section
      class="render-editor"
      email-compose
      [(value)]="replica"
      [(sourceView)]="sourceView"
      [codePortal]="codePortal()"
      [codeEditor]="sourcePane()?.editor()"
      [attr.aria-label]="'render.replica' | translate"
    ></section>

    <!-- The replica's HTML: out of sight here, it moves into the editor's
       box in HTML view. -->
    <section
      html-email-compose
      #sourceEl
      [hidden]="sourceView() !== 'code'"
      [active]="sourceView() === 'code'"
      [(html)]="replica"
      [attr.aria-label]="'render.source' | translate"
    ></section>

    <iframe
      class="render-original"
      sandbox
      [srcdoc]="original()"
      [title]="'render.original' | translate"
    ></iframe>
  } @else {
    <p class="render-empty">{{ 'render.loading' | translate }}</p>
  }

  <nav class="render-stepper" [attr.aria-label]="'render.examples' | translate">
    <button
      mat-icon-button
      type="button"
      (click)="step(-1)"
      [disabled]="pairs().length < 2"
      [attr.aria-label]="'render.previous' | translate"
    >
      <mat-icon>keyboard_arrow_up</mat-icon>
    </button>
    <span class="render-count" aria-live="polite">
      {{ pairs().length ? index() + 1 : 0 }} / {{ pairs().length }}
    </span>
    <button
      mat-icon-button
      type="button"
      (click)="step(1)"
      [disabled]="pairs().length < 2"
      [attr.aria-label]="'render.next' | translate"
    >
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </nav>
</div>
