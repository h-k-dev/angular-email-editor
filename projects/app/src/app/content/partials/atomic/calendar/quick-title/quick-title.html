<!-- One signal form: Enter in the title is its submit, so is Mod-Enter in
     the description. -->
<form class="quick-title" [formRoot]="quick" novalidate>
  <!-- Its height run when the description comes out or goes
       ([heightSwitch]). -->
  <div class="quick-title__motion" [heightSwitch]="noteShown()">
    <div class="quick-title__fields">
      <input
        #title
        class="quick-title__field"
        type="text"
        autocomplete="off"
        [formField]="quick.title"
        [placeholder]="'calendar.addTitle' | translate"
        [attr.aria-label]="'calendar.title' | translate"
        (keydown.shift.enter)="openNote($event)"
      />
      @if (noteShown()) {
        <note-editor
          class="quick-title__note"
          [formField]="quick.description"
          [placeholder]="'calendar.addDescription' | translate"
          [label]="'calendar.addDescription' | translate"
          (putAway)="closeNote()"
        />
      }
    </div>
  </div>
</form>
