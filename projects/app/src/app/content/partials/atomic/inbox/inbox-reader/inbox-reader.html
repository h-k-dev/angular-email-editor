@if (missing()) {
  <p class="inbox-reader__missing">{{ 'inbox.missing' | translate }}</p>
} @else if (header(); as head) {
  <!-- One sheet of paper (`mail-view`): the header and the body on the
       reading paper — the inbox's pane is the island it lies on. The header
       is the listing's, there at once; the body comes when fetched. -->
  <article
    mail-view
    [subject]="head.subject"
    [name]="head.name"
    [address]="address()"
    [to]="head.to"
    [cc]="head.cc ?? null"
    [date]="date()"
    [html]="mail()?.html ?? null"
    [scheme]="paper()"
    [bodyLabel]="'inbox.body' | translate"
    (answer)="answer($event)"
    (flipPaper)="flipPaper()"
  ></article>
}
