@if (missing()) {
  <p class="inbox-reader__missing">{{ 'inbox.missing' | translate }}</p>
} @else if (mail(); as mail) {
  <!-- One sheet of paper (`mail-view`): the header and the body on the
       reading paper — the inbox's pane is the island it lies on. -->
  <article
    mail-view
    [subject]="mail.subject"
    [name]="mail.name"
    [address]="address()"
    [to]="mail.to"
    [cc]="mail.cc ?? null"
    [date]="date()"
    [html]="mail.html"
    [scheme]="paper()"
    [bodyLabel]="'inbox.body' | translate"
    (answer)="answer($event)"
    (flipPaper)="flipPaper()"
  >
    <!-- An invitation's card, Gmail's: in a chunk of its own (ical.js's
         reader is the import's; Luxon is the calendar's), fetched only for
         a message that is one. -->
    @if (mail.invite; as invite) {
      <div mailViewLead>
        @defer {
          <app-invite-card [invite]="invite" />
        }
      </div>
    }
  </article>
}
