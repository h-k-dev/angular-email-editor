<!-- The thumbnail: the template's top, drawn only once the card has been
     looked at (a row drawn ahead of the view holds its place, a skeleton);
     its dialect over the corner. -->
<div class="template-card__thumb">
  <email-thumbnail *gridSeen [html]="card().template.html" />
  <span badge tone="overlay" class="template-card__badge">{{ card().dialect }}</span>
</div>

<!-- The template's own avatar: its name's initials, on its name's hue (the
     card's `[hueOf]`, bound by the gallery) — not its set's. -->
<div class="template-card__meta">
  <span class="template-card__avatar" [avatar]="card().template.name"></span>
  <div class="template-card__text">
    <!-- The card's press: its name, its hit area the grid's whole wash. -->
    <h3 class="template-card__title">
      <button type="button" class="template-card__open" data-grid-press (click)="design()">
        {{ card().template.name }}
      </button>
    </h3>
    <!-- One line under the name, YouTube's channel · views. -->
    <p class="template-card__line">
      <span>{{ card().set }}</span>
      <span class="template-card__dot" aria-hidden="true">·</span>
      <span>{{ mergeTagsKey() | translate: { count: card().mergeTags } }}</span>
    </p>
  </div>
  <!-- The card's actions: the host's own first (`[card-actions]`), then the
       ⋮ — 32px buttons, the toolbar's; shown on hover, as the ⋮ was. -->
  <div class="template-card__actions">
    <ng-content select="[card-actions]" />
    <button
      matIconButton
      type="button"
      class="template-card__more"
      [attr.aria-label]="'templates.more' | translate"
      [title]="'templates.more' | translate"
      ngMenuTrigger
      #trigger="ngMenuTrigger"
      [menu]="more.menu()"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
  </div>
  <div
    toolbar-menu
    #more
    side="below"
    align="end"
    [label]="'templates.more' | translate"
    [trigger]="trigger"
    [items]="moreItems()"
    (selected)="act($event)"
  ></div>
</div>
