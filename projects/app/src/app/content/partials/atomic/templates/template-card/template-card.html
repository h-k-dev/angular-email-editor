<!-- The thumbnail: the template's top, drawn only once the card has been
     looked at (a row drawn ahead of the view holds its place, a skeleton);
     its dialect over the corner. -->
<div class="template-card__thumb">
  <email-thumbnail *gridSeen [html]="card().template.html" />
  <span badge tone="overlay" class="template-card__badge">{{ card().dialect }}</span>
</div>

<div class="template-card__meta">
  <span class="template-card__avatar" [avatar]="card().set"></span>
  <div class="template-card__text">
    <!-- The card's press: its name, its hit area the whole card. -->
    <h3 class="template-card__title">
      <button type="button" class="template-card__open" (click)="design()">
        {{ card().template.name }}
      </button>
    </h3>
    <!-- One line under the name, YouTube's channel · views. -->
    <p class="template-card__line">
      <span>{{ card().set }}</span>
      <span class="template-card__dot" aria-hidden="true">·</span>
      <span>{{ mergeTagsKey() | translate: { count: card().mergeTags } }}</span>
    </p>
  </div>
  <button
    matIconButton
    type="button"
    class="template-card__more"
    [attr.aria-label]="'templates.more' | translate"
    [title]="'templates.more' | translate"
    ngMenuTrigger
    #trigger="ngMenuTrigger"
    [menu]="more.menu()"
  >
    <mat-icon>more_vert</mat-icon>
  </button>
  <div
    toolbar-menu
    #more
    side="below"
    align="end"
    [label]="'templates.more' | translate"
    [trigger]="trigger"
    [items]="moreItems()"
    (selected)="act($event)"
  ></div>
</div>
