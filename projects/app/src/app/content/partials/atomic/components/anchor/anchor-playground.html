<playground-frame [knobs]="knobs" [value]="{ rect: rect() }">
  <p #text class="ap-text">
    The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. How
    vexingly quick daft zebras jump.
  </p>

  <!-- The anchor: an element over a box, nothing rendered. -->
  <span
    playgroundSubject="Anchor"
    class="ap-anchor"
    [class.ap-anchor--outlined]="outline()"
    [emailAnchor]="rect()"
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
  ></span>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="overlay() && !!rect()"
    [cdkConnectedOverlayPositions]="positions"
  >
    <div class="ap-overlay" role="tooltip">
      {{ rect()?.width }} × {{ rect()?.height }} at {{ rect()?.left }}, {{ rect()?.top }}
    </div>
  </ng-template>
</playground-frame>
