<playground-frame [knobs]="knobs" [actions]="actions" [value]="summary()">
  <!-- The editor's scroll container: a caret menu floats in it, by the
       trigger's line; a docked one is a band under the text. -->
  <div class="sm-box">
    <div #editor class="sm-editor"></div>
    <div
      email-suggestion-menu
      #menu
      playgroundSubject="Menu"
      [state]="state()"
      [placement]="placement()"
      [announceDelay]="announceDelay()"
      [label]="label()"
    >
      @for (item of state()?.items; track item.id) {
        @if (item.heading; as heading) {
          <div email-suggestion-menu-section>{{ heading }}</div>
        }
        <div email-suggestion-menu-item [item]="item">
          @if (item.icon) {
            <mat-icon>{{ item.icon }}</mat-icon>
          }
          <span class="sm-title">{{ item.title }}</span>
          @if (item.detail) {
            <span class="sm-detail">{{ item.detail }}</span>
          }
          @if (item.children) {
            <mat-icon class="sm-more">chevron_right</mat-icon>
          }
        </div>
      }
    </div>
  </div>
</playground-frame>
