<!-- Where you are, small, at the top left: the page's icon, its group, and
     the page itself — held at the top while the page scrolls under it. -->
<header page-header class="doc-header">
  <nav class="doc-trail" [attr.aria-label]="'docs.trail' | translate">
    <mat-icon class="doc-trail__icon" aria-hidden="true">{{ icon() }}</mat-icon>
    <ol class="doc-trail__steps">
      @for (key of trail(); track key; let last = $last) {
        <li class="doc-trail__step" [attr.aria-current]="last ? 'page' : null">
          {{ key | translate }}
        </li>
      }
    </ol>
  </nav>
</header>

<div class="doc-layout">
  <article class="doc-body">
    <ng-content />
  </article>

  <!-- The table of contents, once there is room beside the column. -->
  @if (toc().length) {
    <nav docToc class="doc-toc" [entries]="toc()"></nav>
  }
</div>
