<button
  type="button"
  class="color-palette__swatch color-palette__swatch--auto"
  role="option"
  [attr.aria-selected]="value() === null"
  [title]="resetLabel()"
  [attr.aria-label]="resetLabel()"
  (click)="picked.emit(null)"
>
  <mat-icon>format_color_reset</mat-icon>
</button>
@for (color of swatches(); track color.value) {
  <button
    type="button"
    class="color-palette__swatch"
    role="option"
    [attr.aria-selected]="selected() === color.value"
    [title]="color.name"
    [attr.aria-label]="color.name"
    [style.--email-swatch]="color.shown"
    (click)="picked.emit(color.value)"
  ></button>
}
<!-- The custom colour, where the host offers one: the last row, in words —
     "Custom text color…" — opening our own picker in its place (a shade
     square, a hue slider, the hex). A colour applied there lands as a
     swatch of its own (the host's custom swatches). -->
@if (customLabel(); as label) {
  @if (editing()) {
    <div
      custom-color
      class="color-palette__custom"
      [label]="label"
      [value]="value()"
      (picked)="pickCustom($event)"
    ></div>
  } @else {
    <button
      type="button"
      class="color-palette__custom color-palette__custom-row"
      role="option"
      [attr.aria-selected]="custom() !== null"
      (click)="editing.set(true)"
    >
      <span
        class="color-palette__custom-swatch"
        [attr.data-filled]="custom() !== null || null"
        [style.--email-swatch]="customShown()"
      >
        @if (custom() === null) {
          <mat-icon>colorize</mat-icon>
        }
      </span>
      <span>{{ label }}</span>
    </button>
  }
}
