<section class="color-picker__part">
  <h3 class="color-picker__heading" [id]="id + '-text'">
    {{ 'editor.color.text' | translate }}
  </h3>
  <div
    color-palette
    [attr.aria-labelledby]="id + '-text'"
    [resetLabel]="'editor.color.automatic' | translate"
    [colors]="textPalette()"
    [customLabel]="'editor.color.customText' | translate"
    [value]="color()"
    (picked)="colorPicked.emit($event)"
  ></div>
</section>
<section class="color-picker__part">
  <h3 class="color-picker__heading" [id]="id + '-background'">
    {{ 'editor.color.background' | translate }}
  </h3>
  <div
    color-palette
    [attr.aria-labelledby]="id + '-background'"
    [resetLabel]="'editor.color.none' | translate"
    [colors]="backgroundPalette()"
    [customLabel]="'editor.color.customBackground' | translate"
    [value]="background()"
    (picked)="backgroundPicked.emit($event)"
  ></div>
</section>
