<!-- The menu, for the composer's one popover: one toolbar, its tools by
     what is selected. The `@switch` swaps the row of tools inside it — the
     toolbar element, and the popover around it, stay; the row that comes
     in fades in (`animate.enter`, see the stylesheet). -->
<ng-template #panel>
  <div
    class="bubble-menu"
    role="toolbar"
    appToolbarKeys
    [attr.aria-label]="menuLabel()"
    emailKeepFocus
  >
    @switch (state().kind) {
      @case ('image') {
        <div class="bubble-menu__tools" animate.enter="bubble-menu__tools--in">
          <!-- The alt leads, as words: what it says, or that it is missing. -->
          <button
            mat-button
            type="button"
            class="bubble-menu__alt"
            [class.bubble-menu__alt--missing]="!alt()"
            aria-haspopup="dialog"
            [attr.aria-label]="altLabel()"
            [emailAction]="altItem.id"
            [emailActionFrom]="actions"
            #altTrigger="emailAction"
            [disabled]="altTrigger.disabled()"
          >
            <span class="bubble-menu__alt-text" dir="auto">{{
              alt() || ('editor.image.addAlt' | translate)
            }}</span>
          </button>
          <ng-container
            *ngTemplateOutlet="buttons; context: { $implicit: imageEntries, lead: true }"
          />
        </div>
      }
      @case ('button') {
        <div class="bubble-menu__tools" animate.enter="bubble-menu__tools--in">
          <ng-container
            *ngTemplateOutlet="buttons; context: { $implicit: buttonEntries, lead: false }"
          />
        </div>
      }
      @default {
        <div class="bubble-menu__tools" animate.enter="bubble-menu__tools--in">
          <ng-container *ngTemplateOutlet="buttons; context: { $implicit: entries(), lead: false }" />
        </div>
      }
    }
  </div>
</ng-template>

<!-- A run of buttons, divided by group; `lead` when something stands
     before the first group, so it gets a divider too. -->
<ng-template #buttons let-entries let-lead="lead">
  @for (entry of entries; track entry.item.id; let first = $first) {
    @let item = entry.item;
    @if (entry.separated || (first && lead)) {
      <mat-divider [vertical]="true" />
    }
    @if (item.picker === 'color') {
      <!-- Colour is the one picker here: it opens the toolbar's colour
           pane at the button (see below), and shows whether the selection
           carries a colour, as the toolbar's button does. -->
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="item.title()"
        [attr.aria-expanded]="colorOpen()"
        [attr.data-applied]="item.applied?.() || null"
        (click)="toggleColor($any($event.currentTarget))"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
      </button>
    } @else {
      <!-- Every other button here is an action — the kit's marks, quote,
           alignment and image tools, the composer's own link — so the
           library's directive does the work on Material's button: it runs
           on click, says pressed, hands the caret back; how disabled looks
           stays Material's, bound from its state. -->
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="item.title()"
        [emailAction]="item.id"
        [emailActionFrom]="actions"
        #trigger="emailAction"
        [disabled]="trigger.disabled()"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
      </button>
    }
  }
</ng-template>

<!-- The colour pane, at the colour button: the toolbar's own pane, on the
     side away from the selection, so the words being coloured stay in
     sight. No backdrop — a press on the menu's other tools or in the text
     goes through, and closes it. On a paper island it wears the island's
     paper (paper-island.ts). -->
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="colorOrigin()"
  [cdkConnectedOverlayPositions]="colorPositions()"
  [cdkConnectedOverlayOpen]="colorOpen()"
  (overlayOutsideClick)="onColorOutsideClick($event)"
  (detach)="colorOpen.set(false)"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
>
  <div
    color-picker
    paperIslandScheme
    [color]="textColor()"
    [background]="backgroundColor()"
    (colorPicked)="applyColor($event)"
    (backgroundPicked)="applyBackground($event)"
  ></div>
</ng-template>
