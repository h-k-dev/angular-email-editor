<!-- The source's editor, on a box that lays out as the host itself
     (display: contents): the host scrolls it, the styles keyed on the host
     reach it. Its HTML both ways, pretty-printed in, the user's edits out. -->
<div
  class="html-email-compose__surface"
  [emailEditor]="kit"
  [emailEditorCodec]="codec"
  [emailEditorOptions]="editorOptions"
  [emailEditorPaused]="!active()"
  [(value)]="html"
></div>

<!-- The autocomplete dropdown, positioned by the extension. -->
<div
  class="html-email-compose__autocomplete"
  #menu
  role="listbox"
  aria-label="Suggestions"
  floatingScrollbar
>
  @if (completions(); as completion) {
    @for (item of completion.items; track item.label; let i = $index) {
      <button
        type="button"
        role="option"
        class="html-email-compose__autocomplete-item"
        [class.html-email-compose__autocomplete-item--active]="i === completion.activeIndex"
        [attr.aria-selected]="i === completion.activeIndex"
        (click)="completion.select(item)"
      >
        {{ item.label }}
      </button>
    }
  }
</div>
