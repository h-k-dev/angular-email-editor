<!-- The aside, the viewport's whole height: the app and Compose on top, the
     places in the middle (scrolling, should they ever outgrow it), the
     settings at its foot — Linear's. -->
<aside class="mailbox-aside">
  <header class="mailbox-aside__head">
    <span class="mailbox-aside__name">{{ 'app.title' | translate }}</span>
    <!-- A new message in a window of its own, over the page — Linear's
         "new issue" beside the workspace. -->
    <button
      matIconButton
      type="button"
      class="mailbox-aside__compose"
      [attr.aria-label]="'app.compose' | translate"
      [title]="'app.compose' | translate"
      (click)="compose()"
    >
      <mat-icon>edit_square</mat-icon>
    </button>
  </header>

  <!-- The places, a run at a time. The place you are in says so to
       assistive tech too (aria-current), not only with its wash. -->
  <nav class="mailbox-aside__nav" [attr.aria-label]="'app.nav.mailbox' | translate">
    @for (section of sections; track section.id) {
      <section
        class="mailbox-section"
        [attr.aria-labelledby]="section.key ? 'mailbox-' + section.id : null"
      >
        @if (section.key) {
          <h2 class="mailbox-section__title" [id]="'mailbox-' + section.id">
            {{ section.key | translate }}
          </h2>
        }
        <ul class="mailbox-section__links">
          @for (link of section.links; track link.path) {
            <li>
              <a
                class="mailbox-link"
                [routerLink]="link.path"
                routerLinkActive="mailbox-link--active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: true }"
                [attr.title]="link.key | translate"
              >
                <mat-icon class="mailbox-link__icon">{{ link.icon }}</mat-icon>
                <span class="mailbox-link__label">{{ link.key | translate }}</span>
                @if (link.count) {
                  <span class="mailbox-link__count">{{ link.count }}</span>
                }
              </a>
            </li>
          }
        </ul>
      </section>
    }
  </nav>

  <!-- The app's settings: its language and its light or dark, two plain
       icon buttons. The menu opens up from the foot, lined up with its
       start. -->
  <footer class="mailbox-aside__foot">
    <div language-menu side="above" align="start"></div>
    <theme-toggle />
  </footer>
</aside>

<!-- The page, on a sheet of its own beside the aside: it scrolls here, the
     aside never does. -->
<div class="mailbox-main">
  <router-outlet />
</div>
