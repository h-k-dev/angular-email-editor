<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="width: 100%; border-collapse: collapse;"
>
  <tbody>
    <tr>
      <td
        bgcolor="#f4f4f4"
        style="background-color: rgb(244, 244, 244); color: rgb(32, 33, 36);"
      >
        <div
          style="
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px 16px;
            box-sizing: border-box;
            background-color: rgb(193, 39, 45);
            color: rgb(255, 255, 255);
          "
        >
          <div
            style="
              width: 100%;
              max-width: 600px;
              margin-left: auto;
              margin-right: auto;
            "
          >
            <div
              style="
                display: inline-block;
                width: 100%;
                max-width: 560px;
                vertical-align: top;
                box-sizing: border-box;
              "
            >
              <div style="text-align: center; margin: 10px 25px;">
                <img
                  src="https://static.mailjet.com/mjml-website/templates/happy-new-year-logo.png"
                  width="128"
                  style="width: 100%; max-width: 128px; height: auto;"
                >
              </div>
            </div>
          </div>
        </div>
      </td>
    </tr>
  </tbody>
</table>
